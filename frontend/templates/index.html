<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Posts</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/styles.css">
</head>
<body>
    <div class="container">
        <h1>📚 Blog Posts</h1>
        <div class="input-field">
            <input type="text" id="api-base-url" placeholder="Enter API Base URL" value="http://127.0.0.1:5002/api">
            <button onclick="loadPosts()">Load Posts</button>
        </div>
        <div class="input-field">
            <input type="text" id="post-title" placeholder="Enter Post Title">
            <input type="text" id="post-content" placeholder="Enter Post Content">
            <input type="text" id="post-author" placeholder="Enter Author">
            <input type="date" id="post-date" title="Post date (defaults to today)">
            <button onclick="addPost()">Add Post</button>
        </div>
        <div class="input-field">
            <input type="text" id="search-term" placeholder="Search posts"
                   onkeydown="if (event.key === 'Enter') loadPosts()">
            <select id="search-field" title="Field to search in">
                <option value="all">All fields</option>
                <option value="title">Title</option>
                <option value="content">Content</option>
                <option value="author">Author</option>
                <option value="date">Date</option>
            </select>
            <select id="sort-field" title="Sort by" onchange="loadPosts()">
                <option value="">No sorting</option>
                <option value="title">Title</option>
                <option value="content">Content</option>
                <option value="author">Author</option>
                <option value="date">Date</option>
            </select>
            <select id="sort-direction" title="Sort direction" onchange="loadPosts()">
                <option value="asc">Ascending</option>
                <option value="desc">Descending</option>
            </select>
            <button onclick="loadPosts()">Search</button>
            <button class="secondary" onclick="clearSearch()">Clear</button>
        </div>
        <div id="post-container">
            <!-- Blog posts will be inserted here by JavaScript -->
        </div>
    </div>

    <script src="static/main.js"></script>
</body>
</html>
